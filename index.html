<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>网站升级维护中 | 睿欣科技</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .box {
    text-align: center;
    padding: 48px 32px;
    max-width: 520px;
  }
  .ring {
    width: 64px; height: 64px;
    margin: 0 auto 26px;
    border: 4px solid #232936;
    border-top-color: #4f8cff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 14px; letter-spacing: 1px; }
  p { color: #9aa0a6; font-size: 15px; line-height: 1.8; margin: 0; }
  .tag {
    display: inline-block;
    margin-top: 22px;
    padding: 8px 20px;
    border: 1px solid #232936;
    border-radius: 24px;
    color: #6b7280;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="ring"></div>
    <h1>网站升级维护中</h1>
    <p>尊敬的用户，本网站正在升级维护，<br>暂时无法提供下载服务。<br>请您稍后再次访问，给您带来不便敬请谅解。</p>
    <div class="tag">睿欣科技 · 短线智能交易系统</div>
  </div>
</body>
</html>
