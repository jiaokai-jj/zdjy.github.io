name: Deploy Cloudflare Worker

on:
  push:
    branches: [main, master]
    paths:
      - worker.js
      - wrangler.toml
      - .github/workflows/deploy.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy jyt-license-server
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9d3c1b75930d4d34eb68ab9334f78ce3

      - name: Set ADMIN_KEY secret
        run: echo "$ADMIN_KEY" | npx wrangler@3 secret put ADMIN_KEY
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9d3c1b75930d4d34eb68ab9334f78ce3
